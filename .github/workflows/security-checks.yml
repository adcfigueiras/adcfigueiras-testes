name: Verificação de segurança pré-lançamento

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Segurança estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/security-smoke.mjs
          node --check scripts/build-staging.mjs
          node --check tests/staging-build.mjs
      - name: Executar verificações de segurança
        run: node tests/security-smoke.mjs
      - name: Confirmar isolamento de pré-produção
        run: node tests/staging-build.mjs

  postgres-migrations:
    name: Migrações SQL e permissões (dados fictícios)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ficticio_so_para_ci
          POSTGRES_DB: figueiras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d figueiras_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ficticio_so_para_ci
      PGDATABASE: figueiras_test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL, se necessário
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Criar esquema fictício
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/fixture.sql
      - name: Executar as quatro migrações pendentes em PostgreSQL isolado
        run: |
          set -e
          psql -X -v ON_ERROR_STOP=1 -f SUPABASE_MIGRATION_NUTRITION_SETTINGS.sql
          psql -X -v ON_ERROR_STOP=1 -f SUPABASE_MIGRATION_TERMS_ACCEPTANCES.sql
          psql -X -v ON_ERROR_STOP=1 -f SUPABASE_MIGRATION_SECURITY_RATE_LIMIT.sql
          psql -X -v ON_ERROR_STOP=1 -f SUPABASE_MIGRATION_CALLUP_PUBLIC.sql
      - name: Testar RLS, convocatórias, notificações, termos e limites
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/assertions.sql
